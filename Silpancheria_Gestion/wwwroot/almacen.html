<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacén & Compras — Silpancharía</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/silpancharia.css" rel="stylesheet">
    <style>
        body {
            background: var(--bg);
            padding: 24px;
        }

        .page-card {
            max-width: 1100px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="page-card">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3" style="border-bottom:1px solid var(--border)">
            <div>
                <h3 class="fw-bold mb-0" style="color:var(--text)">
                    <i class="bi bi-truck me-2" style="color:var(--primary)"></i>Encargado de Compras / Almacén
                </h3>
                <span class="text-muted small" id="lblUsuario">Cargando...</span>
            </div>
            <div class="d-flex gap-2">
                <a href="index.html" class="btn btn-secondary-app btn-sm"><i class="bi bi-grid me-1"></i> Panel</a>
                <button type="button" onclick="cerrarSesion()" class="btn btn-sm" style="border:1px solid var(--danger);color:var(--danger);border-radius:8px;background:#fff">
                    <i class="bi bi-power"></i> Salir
                </button>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card-app">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-box-arrow-in-down"></i> Registrar entrada de mercadería</h5>
                        <form onsubmit="registrarCompra(event)">
                            <div class="mb-3">
                                <label class="form-label">Insumo / Producto</label>
                                <input type="text" id="compraInsumo" class="form-control" placeholder="Ej: Carne de Res, Cajas de Soda" required>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label">Cantidad ingresada</label>
                                    <input type="number" step="0.01" id="compraCantidad" class="form-control" required placeholder="Ej: 50">
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label">Unidad</label>
                                    <select id="compraUnidad" class="form-select">
                                        <option value="Kg">Kg</option>
                                        <option value="Lt">Lt</option>
                                        <option value="Unid">Unid</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Proveedor / Observación</label>
                                <input type="text" id="compraObs" class="form-control" placeholder="Opcional">
                            </div>
                            <button type="submit" class="btn btn-primary-app w-100">
                                <i class="bi bi-check-lg me-1"></i> Registrar entrada
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card-app">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-clipboard-check"></i> Ajuste de inventario físico</h5>
                        <form onsubmit="ajustarInventario(event)">
                            <div class="mb-3">
                                <label class="form-label">Producto</label>
                                <input type="text" id="ajusteProducto" class="form-control" required placeholder="Nombre del producto">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Cantidad contada</label>
                                <input type="number" step="0.01" id="ajusteCantidad" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary-app w-100">
                                <i class="bi bi-check-lg me-1"></i> Aplicar ajuste
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <footer class="app-footer mt-4" style="border-radius:12px">
            <div><strong>Silpancharía</strong> · Módulo Almacén</div>
            <div>© 2026 · Versión 1.0</div>
        </footer>
    </div>

    <script>
                const user = JSON.parse(localStorage.getItem('usuarioActivo') || 'null');
                if (!user) {
                    document.getElementById('lblUsuario').textContent = 'Sesión local / Almacén';
                } else {
                    document.getElementById('lblUsuario').textContent = (user.nombre || user.name || 'Usuario') + ' · Almacén';
                }

                function cerrarSesion() {
                    localStorage.removeItem('usuarioActivo');
                    window.location.href = 'index.html';
                }

                function registrarCompra(e) {
                    e.preventDefault();
                    alert('Entrada registrada (conecta esta función a tu API de compras/movimientos si aún no está enlazada).');
                    e.target.reset();
                }

                function ajustarInventario(e) {
                    e.preventDefault();
                    alert('Ajuste aplicado (conecta esta función a tu API de movimientos).');
                    e.target.reset();
                }
    </script>
</body>
</html>
