<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — SILPANCHARÍA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/silpancharia.css" rel="stylesheet">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--sidebar);">
    <div class="card-app" style="width:100%;max-width:380px;">
        <div class="card-body" style="padding:32px;">
            <div class="text-center mb-4">
                <i class="bi bi-egg-fried" style="font-size:2rem;color:var(--primary);"></i>
                <h4 class="mt-2 mb-0">SILPANCHARÍA</h4>
                <p class="text-muted" style="font-size:0.8rem;">Inicia sesión para continuar</p>
            </div>
            <form id="formLogin">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" id="loginUsername" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="loginPassword" class="form-control" required>
                </div>
                <div id="loginError" class="text-danger mb-3" style="font-size:0.85rem;display:none;"></div>
                <button type="submit" class="btn btn-primary-app w-100">Ingresar</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const error = document.getElementById('loginError');
            error.style.display = 'none';

            try {
                const resp = await fetch('/api/Auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('loginUsername').value,
                        password: document.getElementById('loginPassword').value
                    })
                });

                if (!resp.ok) {
                    const datos = await resp.json().catch(() => ({}));
                    error.textContent = datos.mensaje || 'No se pudo iniciar sesión';
                    error.style.display = 'block';
                    return;
                }

                window.location.href = '/index.html';
            } catch (err) {
                error.textContent = 'Error de conexión con el servidor';
                error.style.display = 'block';
            }
        });
    </script>
</body>
</html>
