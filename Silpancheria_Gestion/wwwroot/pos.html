<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Punto de Venta POS - Silpanchería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #fff;
        }

        .card-dark {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        .btn-pos {
            height: 100px;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="p-4">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
        <div>
            <h3 class="fw-bold mb-0 text-success"><i class="bi bi-cash-coin me-2"></i>Caja / Punto de Venta (POS)</h3>
            <span class="text-secondary small" id="lblUsuario">Cargando...</span>
        </div>
        <div>
            <button class="btn btn-outline-warning btn-sm me-2" data-bs-toggle="modal" data-bs-target="#modalFaltante"><i class="bi bi-exclamation-triangle"></i> Reportar Faltante</button>
            <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm"><i class="bi bi-power"></i> Salir</button>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-7">
            <h5 class="fw-bold mb-3">Menú de Productos</h5>
            <div class="row g-3">
                <div class="col-6">
                    <button class="btn btn-primary w-100 btn-pos d-flex flex-column align-items-center justify-content-center" onclick="agregarAlCarrito('Silpancho Simple', 20)">
                        <span>Silpancho Simple</span>
                        <span class="fs-6 text-warning">20 Bs.</span>
                    </button>
                </div>
                <div class="col-6">
                    <button class="btn btn-primary w-100 btn-pos d-flex flex-column align-items-center justify-content-center" onclick="agregarAlCarrito('Silpancho Doble', 30)">
                        <span>Silpancho Doble</span>
                        <span class="fs-6 text-warning">30 Bs.</span>
                    </button>
                </div>
                <div class="col-6">
                    <button class="btn btn-secondary w-100 btn-pos d-flex flex-column align-items-center justify-content-center" onclick="agregarAlCarrito('Sodio 2 Litros', 12)">
                        <span>Soda 2 Litros</span>
                        <span class="fs-6 text-warning">12 Bs.</span>
                    </button>
                </div>
                <div class="col-6">
                    <button class="btn btn-secondary w-100 btn-pos d-flex flex-column align-items-center justify-content-center" onclick="agregarAlCarrito('Cerveza / Refresco', 8)">
                        <span>Refresco Personal</span>
                        <span class="fs-6 text-warning">8 Bs.</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card-dark p-3">
                <h5 class="fw-bold border-bottom border-secondary pb-2">Detalle del Pedido</h5>
                <div id="carrito" class="my-3" style="min-height: 150px;">
                    <p class="text-secondary text-center">No hay productos seleccionados.</p>
                </div>
                <div class="d-flex justify-content-between fs-4 fw-bold border-top border-secondary pt-2">
                    <span>Total:</span>
                    <span class="text-success" id="totalBs">0 Bs.</span>
                </div>
                <button class="btn btn-success w-100 py-3 mt-3 fw-bold fs-5" onclick="completarVenta()"><i class="bi bi-printer me-2"></i> Cobrar e Imprimir</button>
            </div>
        </div>
    </div>

    <!-- MODAL REPORTAR FALTANTE -->
    <div class="modal fade" id="modalFaltante" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning"><i class="bi bi-exclamation-triangle me-2"></i>Reportar Agotamiento / Faltante</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="txtFaltante" class="form-control bg-secondary text-white border-0" placeholder="Ej: Se terminaron las sodas de 2 Litros">
                    <button class="btn btn-warning w-100 mt-3 fw-bold" onclick="enviarReporteFaltante()">Enviar Alerta</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    const user = JSON.parse(localStorage.getItem('usuarioActivo'));
    if (!user) window.location.href = 'index.html';
    document.getElementById('lblUsuario').innerText = `Atendido por: ${user.usuario}`;

    let total = 0;
    let items = [];

    function agregarAlCarrito(nombre, precio) {
      items.push({ nombre, precio });
      total += precio;
      renderCarrito();
    }

    function renderCarrito() {
      const c = document.getElementById('carrito');
      if(items.length === 0) {
        c.innerHTML = '<p class="text-secondary text-center">No hay productos seleccionados.</p>';
      } else {
        c.innerHTML = items.map(i => `<div class="d-flex justify-content-between small my-1"><span>${i.nombre}</span><span>${i.precio} Bs.</span></div>`).join('');
      }
      document.getElementById('totalBs').innerText = `${total} Bs.`;
    }

    function completarVenta() {
      if(items.length === 0) return alert('El carrito está vacío');
      alert('Venta registrada con éxito. Se ha descontado el stock de insumos automáticamente.');
      items = [];
      total = 0;
      renderCarrito();
    }

    function enviarReporteFaltante() {
      alert('Notificación enviada al almacén/administrador.');
      bootstrap.Modal.getInstance(document.getElementById('modalFaltante')).hide();
    }

    function cerrarSesion() {
      localStorage.removeItem('usuarioActivo');
      window.location.href = 'index.html';
    }
    </script>
</body>
</html>
